name: Bitget Scanner
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: bitget-scanner
  cancel-in-progress: false

jobs:
  pump:
    runs-on: ubuntu-latest
    timeout-minutes: 62
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: restore state
        uses: actions/cache/restore@v4
        with:
          path: state-pump.json
          key: scanner-pump-${{ github.run_id }}
          restore-keys: scanner-pump-
      - name: Run pump tracker
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scanner.py --state state-pump.json --no-vol --loop 20 --duration 3000 --workers 12 --pump-tf 1min --big-candle 1.5 --pump-min-candle-usd 200 --confirm-sec 20 --pump-max-age 150 --rebound-candles 10
      - name: save state
        uses: actions/cache/save@v4
        if: always()
        with:
          path: state-pump.json
          key: scanner-pump-${{ github.run_id }}

  volume:
    runs-on: ubuntu-latest
    timeout-minutes: 62
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: restore state
        uses: actions/cache/restore@v4
        with:
          path: state-vol.json
          key: scanner-vol-${{ github.run_id }}
          restore-keys: scanner-vol-
      - name: Run volume scanner
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scanner.py --state state-vol.json --no-pump --loop 30 --duration 3000 --workers 12 --windows 1 --ratio 40 --boom-ratio 40 --min-usd 2000 --cooldown 1800 --vol-step 2
      - name: save state
        uses: actions/cache/save@v4
        if: always()
        with:
          path: state-vol.json
          key: scanner-vol-${{ github.run_id }}

  volume1m:
    runs-on: ubuntu-latest
    timeout-minutes: 62
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: restore state
        uses: actions/cache/restore@v4
        with:
          path: state-vol1m.json
          key: scanner-vol1m-${{ github.run_id }}
          restore-keys: scanner-vol1m-
      - name: Run 1-minute volume scanner
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scanner.py --state state-vol1m.json --no-pump --no-daily --loop 20 --duration 3000 --workers 12 --tf 1min --tag 1m-PUMP --windows 1,3,5 --ratio 10 --boom-ratio 10 --min-usd 1500 --min-rise 0 --vis-min-move 0 --min-active 2 --cooldown 1800 --vol-step 2
      - name: save state
        uses: actions/cache/save@v4
        if: always()
        with:
          path: state-vol1m.json
          key: scanner-vol1m-${{ github.run_id }}
